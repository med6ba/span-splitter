<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <title>Medba Span Splitter</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app-shell">

    <main class="workstation" aria-label="HTML span splitter">
      <section class="panel" aria-label="Input HTML">
        <div class="panel-head">
          <div class="panel-heading"><span class="panel-dot input-dot" aria-hidden="true"></span><h1>Input HTML</h1></div>
          <div class="tools">
            <button class="text-button" id="importButton" type="button" title="Import an HTML file">Import</button>
            <button class="text-button" id="clearButton" type="button" title="Clear editor">Clear</button>
            <input id="fileInput" type="file" accept=".html,.htm,.txt,text/html,text/plain" hidden>
          </div>
        </div>
        <div class="editor-wrap">
          <label for="source" class="sr-only">HTML source code</label>
          <textarea id="source" class="code-editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Paste your HTML here..."></textarea>
        </div>
        <div class="panel-foot">
          <span id="sourceStats">0 characters</span>
          
        </div>
      </section>

      <section class="panel" aria-label="Output HTML">
        <div class="panel-head output-header">
          <div class="panel-heading"><span class="panel-dot output-dot" aria-hidden="true"></span><h2>Output</h2></div>
          <div class="tools">
            <div class="view-switch" role="group" aria-label="Output view">
              <button id="codeTab" class="view-button active" type="button" aria-pressed="true">Code</button>
              <button id="previewTab" class="view-button" type="button" aria-pressed="false">Preview</button>
            </div>
            <button class="icon-button theme-button" id="themeButton" type="button" title="Switch theme" aria-label="Switch theme">
              <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
              <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/></svg>
            </button>
          </div>
        </div>
        <div class="result-area">
          <div id="codeView" class="code-view">
            <label for="result" class="sr-only">Converted HTML</label>
            <textarea id="result" class="code-editor" readonly spellcheck="false" placeholder="Your converted HTML will appear here..."></textarea>
          </div>
          <div id="previewView" class="preview-view" hidden>
            <iframe id="preview" title="HTML output preview" sandbox="" referrerpolicy="no-referrer"></iframe>
          </div>
        </div>
        <div class="panel-foot output-foot">
          <span id="resultStats">0 spans</span>
          <div class="tools">
            <button id="copyButton" class="secondary-button" type="button">Copy</button>
            <button id="downloadButton" class="primary-button" type="button">Download HTML</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/script.js"></script>
</body>
</html>
